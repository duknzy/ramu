    .m-math-key {

<header class="m-header">
    <div class="m-logo">LOLZ</div>
    <div class="m-auth-chip" id="auth-chip">読込中…</div>

<div id="login-required-notice" class="m-login-gate" style="display:none;">

</div>

<main id="main-content" style="display:none;">

    <div class="m-panel m-score-card">
        <div class="m-score-top">
            <span class="m-score-title">記憶安定度スコア</span>
        </div>
        <div class="m-score-row"><span>総合記憶定着率（推定）</span><span id="retention-rate-display">--%</span></div>

    <div class="m-panel m-filter-panel">

        window.insertMathSymbol = function(startTag, endTag = "") {
            const textarea = document.getElementById('problem-text-input');
            if (!textarea) return;

            let startPos = textarea.selectionStart;
            let endPos = textarea.selectionEnd;
            const currentText = textarea.value;

            const textBeforeCursor = currentText.substring(0, startPos);
            const dollarCount = (textBeforeCursor.match(/\$/g) || []).length;

            if (startTag !== '$' && dollarCount % 2 === 0) {
                startTag = '$' + startTag;
                endTag = endTag + '$';
            }

            const selectedText = currentText.substring(startPos, endPos);
            const replacement = startTag + selectedText + endTag;

            textarea.value = currentText.substring(0, startPos) + replacement + currentText.substring(endPos);
            textarea.focus();

            const newCursorPos = startPos + startTag.length + selectedText.length;
            textarea.selectionStart = newCursorPos;
            textarea.selectionEnd = newCursorPos;

            window.updateMathPreview(true);
        };

        // 数式リアルタイムプレビュー更新処理
        window.updateMathPreview = function(immediate = false) {
            const textarea = document.getElementById('problem-text-input');
            const preview = document.getElementById('math-preview');
            if (!textarea || !preview) return;

            preview.innerHTML = textarea.value ? textarea.value : "入力プレビューがここに表示されます";

            if (previewTimeout) {
                clearTimeout(previewTimeout);
            }

            const renderMath = () => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([preview]).catch((err) => console.log(err.message));
                }
            };

            if (immediate) {
                renderMath();
            } else {
                previewTimeout = setTimeout(renderMath, 300);
            }
        };

const MIN_PLAUSIBLE_TS = Date.UTC(2020, 0, 1);
function resolveCreatedAt(p) {
    if (p.createdAt) return { date: new Date(p.createdAt), estimated: false };
    if (p.id) {
        const parts = p.id.split("_");
        const ts = parts.map(Number).find(n => !isNaN(n) && n >= MIN_PLAUSIBLE_TS);
        if (ts) return { date: new Date(ts), estimated: false };
    }
    if (p.lastAttemptAt) return { date: new Date(p.lastAttemptAt), estimated: true };
    return null;
}
function formatShortDate(d) {
    if (!d) return null;
    return d.toLocaleDateString('ja-JP', { year: '2-digit', month: 'numeric', day: 'numeric' });
}
function buildRowPreviewText(rawTitle, maxLen = 40) {
    if (!rawTitle) return "";
    const oneLine = String(rawTitle).replace(/\\n/g, " ").replace(/\r?\n/g, " ").trim();
    let body = oneLine, suffix = "";
    if (oneLine.length > maxLen) {
        body = oneLine.slice(0, maxLen);
        suffix = "…";
        const dollarCount = (body.match(/\$/g) || []).length;
        if (dollarCount % 2 !== 0) {
            const lastDollar = body.lastIndexOf("$");
            body = body.slice(0, lastDollar).trimEnd();
        }
    }
    const parts = body.split(/(\$[^$]+\$)/g);
    return parts.map(part => {
        if (part.startsWith("$") && part.endsWith("$")) return part;
        return part.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }).join("") + suffix;
}

function rebuildFilterBarAndCards() {
    const dynamicArea = document.getElementById("dynamic-cards-area");
    const subjectContainer = document.getElementById("subject-tab-container");
    const fieldSelect = document.getElementById("field-filter-select");

    const subjectMap = {};
    Object.keys(lastCloudProblemsSnapshot).forEach(id => {
        const p = lastCloudProblemsSnapshot[id];
        const rawSubject = p.subject || "未分類";
        const rawField = p.field || "未分類";
        if (!subjectMap[rawSubject]) subjectMap[rawSubject] = new Set();
        subjectMap[rawSubject].add(rawField);
    });

    let subjectHtml = `<button type="button" class="m-subject-chip ${currentSubjectFilter === 'ALL' ? 'active' : ''}" data-subject="ALL">✨ すべて</button>`;
    Object.keys(subjectMap).forEach(sub => {
        subjectHtml += `<button type="button" class="m-subject-chip ${currentSubjectFilter === sub ? 'active' : ''}" data-subject="${sub}">${sub}</button>`;
    });
    subjectContainer.innerHTML = subjectHtml;
    subjectContainer.querySelectorAll(".m-subject-chip").forEach(btn => {
        btn.addEventListener("click", (e) => {
            currentSubjectFilter = e.currentTarget.getAttribute("data-subject");
            currentFieldFilter = "ALL";
            rebuildFilterBarAndCards();
        });
    });

    if (currentSubjectFilter !== "ALL" && subjectMap[currentSubjectFilter]) {
        fieldSelect.style.display = "block";
        let opts = `<option value="ALL">✨ ${currentSubjectFilter} の全単元</option>`;
        subjectMap[currentSubjectFilter].forEach(fld => {
            opts += `<option value="${fld}" ${currentFieldFilter === fld ? 'selected' : ''}>${fld}</option>`;
        });
        fieldSelect.innerHTML = opts;
        fieldSelect.onchange = (e) => { currentFieldFilter = e.target.value; rebuildFilterBarAndCards(); };
    } else {
        fieldSelect.style.display = "none";
    }

    dynamicArea.innerHTML = "";
    let dynamicTotalCount = 0, solvedTodayCount = 0, criticalDueCount = 0, safeCount = 0, totalProblemEntries = 0;
    const todayStr = new Date().toDateString();

    const urgencyColorMap = { "badge-overdue": "var(--accent-yellow)", "badge-critical": "var(--accent-magenta)", "badge-new": "#888", "badge-pending": "#b16eff", "badge-safe": "var(--accent-cyan)" };
    const badgeClassMap = { "badge-overdue": "m-badge-yellow", "badge-critical": "m-badge-magenta", "badge-new": "m-badge-muted", "badge-pending": "m-badge-muted", "badge-safe": "m-badge-cyan" };
    const sectionOrder = [
        { key: "badge-overdue", label: "⚠️ 忘却危機" },
        { key: "badge-critical", label: "🔥 要復習" },
        { key: "badge-new", label: "🆕 未挑戦" },
        { key: "badge-pending", label: "⏳ 定着中" },
        { key: "badge-safe", label: "✨ 克服済" }
    ];
    const buckets = { "badge-overdue": [], "badge-critical": [], "badge-new": [], "badge-pending": [], "badge-safe": [] };

    Object.keys(lastCloudProblemsSnapshot).forEach(id => {
        let p = lastCloudProblemsSnapshot[id];
        let subjectText = p.subject || "未分類";
        let fieldText = p.field || "未分類";
        if (currentSubjectFilter !== "ALL" && subjectText !== currentSubjectFilter) return;
        if (currentFieldFilter !== "ALL" && fieldText !== currentFieldFilter) return;
        if (currentSearchQuery) {
            const haystack = [p.short_title, p.title, p.field, p.subject, p.insight, p.trap_description].filter(Boolean).join(" ").toLowerCase();
            if (!haystack.includes(currentSearchQuery.toLowerCase())) return;
        }

        totalProblemEntries++;
        dynamicTotalCount += Number(p.errorCount || 0);

        if (p.lastAttemptAt && p.lastResult === true && new Date(p.lastAttemptAt).toDateString() === todayStr) {
            solvedTodayCount++;
        }

        let timeBadgeText = "🆕 NEW", timeBadgeClass = "badge-new";
        const boostedAt = p.lessonReviewPriorityAt ? new Date(p.lessonReviewPriorityAt) : null;
        const alreadyReviewedSinceBoost = boostedAt && p.lastAttemptAt && new Date(p.lastAttemptAt) >= boostedAt;
        if (boostedAt && !alreadyReviewedSinceBoost) {
            timeBadgeText = "🎓 授業後の復習"; timeBadgeClass = "badge-overdue"; criticalDueCount++;
        } else if (p.lastAttemptAt) {
            const lastTime = new Date(p.lastAttemptAt).getTime();
            const diffDays = (Date.now() - lastTime) / (1000 * 60 * 60 * 24);
            const difficulty = Number(p.errorCount || 1);
            let optimalInterval = 7;
            if (difficulty === 1) optimalInterval = 4;
            if (difficulty === 2) optimalInterval = 2;
            if (difficulty >= 3) optimalInterval = 1;

            if (p.errorCount === 0 || p.lastResult === true) {
                timeBadgeText = "✨ SAFE"; timeBadgeClass = "badge-safe"; safeCount++;
            } else if (diffDays >= optimalInterval * 1.5) {
                timeBadgeText = "⚠️ OVERDUE"; timeBadgeClass = "badge-overdue"; criticalDueCount++;
            } else if (diffDays >= optimalInterval) {
                timeBadgeText = "🔥 CRITICAL"; timeBadgeClass = "badge-critical"; criticalDueCount++;
            } else {
                timeBadgeText = "⏳ PENDING"; timeBadgeClass = "badge-pending";
            }
        } else {
            criticalDueCount++;
        }

        let thumbHtml = "";
        if (p.thumb) {
            const imgCount = typeof p.imageCount === "number" ? p.imageCount : 1;
            const countBadge = imgCount > 1 ? `<span class="m-row-thumb-count">+${imgCount - 1}</span>` : "";
            thumbHtml = `<div class="m-row-thumb"><img src="${p.thumb}">${countBadge}</div>`;
        } else {
            const pImages = Array.isArray(p.images) && p.images.length > 0 ? p.images : (p.imageData ? [p.imageData] : []);
            if (pImages.length > 0) {
                const countBadge = pImages.length > 1 ? `<span class="m-row-thumb-count">+${pImages.length - 1}</span>` : "";
                thumbHtml = `<div class="m-row-thumb"><img src="${pImages[0]}">${countBadge}</div>`;
            } else {
                let symbol = "📝", glowClass = "glow-purple";
                if (subjectText.includes("数学")) { symbol = "f(x)"; glowClass = "glow-math"; }
                else if (subjectText.includes("物理")) { symbol = "F"; glowClass = "glow-physics"; }
                else if (subjectText.includes("化学")) { symbol = "mol"; glowClass = "glow-chemistry"; }
                else if (subjectText.includes("世界史")) { symbol = "🌍"; glowClass = "glow-history"; }
                else if (subjectText.includes("英語")) { symbol = "🔤"; glowClass = "glow-english"; }
                else if (subjectText.includes("国語")) { symbol = "📖"; glowClass = "glow-japanese"; }
                else if (subjectText.includes("地歴") || subjectText.includes("公民")) { symbol = "🏛️"; glowClass = "glow-civics"; }
                thumbHtml = `<div class="m-row-thumb ${glowClass}"><span>${symbol}</span></div>`;
            }
        }

        const createdInfo = resolveCreatedAt(p);
        const createdAtDate = createdInfo ? formatShortDate(createdInfo.date) : null;
        const rowColor = urgencyColorMap[timeBadgeClass] || "var(--accent-cyan)";
        const badgeCls = badgeClassMap[timeBadgeClass] || "m-badge-muted";

        const rowHtml = `
            <div class="m-row" onclick="location.href='problem.html?id=${p.id}'" style="border-left: 3px solid ${rowColor};">
                ${thumbHtml}
                <div class="m-row-main">
                    <div class="m-row-badges">
                        <span class="m-badge ${badgeCls}">${subjectText}</span>
                        ${p.insight && p.insight.trim() !== "" ? '<span class="m-badge m-badge-cyan">🧠</span>' : ""}
                    </div>
                    <div class="m-row-title tex2jax_process">${p.short_title || buildRowPreviewText(p.title)}</div>
                    ${createdAtDate ? `<div class="m-row-date">📅 ${createdAtDate}${createdInfo.estimated ? '（推定）' : ''}</div>` : ""}
                </div>
                <div class="m-row-stat" style="color: ${rowColor};">
                    <div class="m-row-stat-num">${String(p.errorCount || 0).padStart(2, '0')}</div>
                    <div class="m-row-stat-label">誤答</div>
                </div>
            </div>
        `;
        if (buckets[timeBadgeClass]) {
            buckets[timeBadgeClass].push({ html: rowHtml, sortDate: createdInfo ? createdInfo.date.getTime() : 0 });
        }
    });

    if (currentProblemSortMode === "priority") {
        sectionOrder.forEach(section => {
            const rows = buckets[section.key];
            if (!rows || rows.length === 0) return;
            const isCollapsed = collapsedSections.has(section.key);
            dynamicArea.insertAdjacentHTML("beforeend", `
                <div class="m-section-header ${isCollapsed ? 'collapsed' : ''}" data-section-key="${section.key}">
                    <div class="m-section-header-left"><span class="m-chevron">▼</span><span>${section.label}</span></div>
                    <span class="m-section-count">${rows.length}</span>
                </div>
                <div class="m-section-rows ${isCollapsed ? 'collapsed' : ''}" data-section-rows="${section.key}">
                    ${rows.map(r => r.html).join("")}
                </div>
            `);
        });
    } else {
        const allRows = sectionOrder.flatMap(section => buckets[section.key] || []);
        allRows.sort((a, b) => currentProblemSortMode === "oldest" ? a.sortDate - b.sortDate : b.sortDate - a.sortDate);
        if (allRows.length > 0) {
            dynamicArea.insertAdjacentHTML("beforeend", `
                <div class="m-section-header" style="cursor:default;">
                    <div class="m-section-header-left"><span>${currentProblemSortMode === "oldest" ? "🗓️ 追加日が古い順" : "🗓️ 追加日が新しい順"}</span></div>
                    <span class="m-section-count">${allRows.length}</span>
                </div>
                <div class="m-section-rows" data-section-rows="__sorted_flat__">${allRows.map(r => r.html).join("")}</div>
            `);
        }
    }

    dynamicArea.querySelectorAll(".m-section-header[data-section-key]").forEach(headerEl => {
        headerEl.addEventListener("click", () => {
            const key = headerEl.getAttribute("data-section-key");
            const rowsEl = dynamicArea.querySelector(`[data-section-rows="${key}"]`);
            if (collapsedSections.has(key)) collapsedSections.delete(key); else collapsedSections.add(key);
            headerEl.classList.toggle("collapsed");
            if (rowsEl) rowsEl.classList.toggle("collapsed");
            persistCollapsedSections();
        });
    });

    if (totalProblemEntries === 0) {
        dynamicArea.innerHTML = `<div class="m-empty">条件に一致する問題が見つかりませんでした。</div>`;
    }

    document.getElementById("total-errors-display").textContent = String(dynamicTotalCount).padStart(2, '0');
    document.getElementById("solved-today-display").textContent = String(solvedTodayCount).padStart(2, '0');
    let retentionRate = totalProblemEntries > 0 ? Math.round((safeCount / totalProblemEntries) * 100) : 100;
    document.getElementById("retention-rate-display").textContent = `${retentionRate}%`;
    document.getElementById("retention-bar-display").style.width = `${retentionRate}%`;
    document.getElementById("due-count-display").textContent = `本日要対応: ${criticalDueCount} 問`;

    if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([dynamicArea]).catch(err => console.log(err.message));
    }
}

    "$$": ["$", "$"],
    "frac": ["\\frac{", "}{}"],
    "sqrt": ["\\sqrt{", "}"],
    "pow": ["^{", "}"],
    "sub": ["_{", "}"],
    "theta": ["\\theta", ""],
    "pi": ["\\pi", ""],
    "alpha": ["\\alpha", ""],
    "beta": ["\\beta", ""],
    "delta": ["\\Delta", ""],
    "pm": ["\\pm", ""],
    "le": ["\\le", ""],
    "ge": ["\\ge", ""],
    "vec": ["\\vec{", "}"],
    "int": ["\\int_{", "}^{}"],
    "log": ["\\log_{", "}"],
    "sin": ["\\sin", ""],

};
document.querySelectorAll(".m-math-key").forEach(btn => {
    btn.addEventListener("click", () => {

document.querySelectorAll(".m-subject-select-btn").forEach(btn => {

// 🖼️ 選択中の写真サムネイル一覧を描画（×で個別削除可能）
function renderImagePreviews() {
    if (!previewContainer) return;
    if (selectedImages.length === 0) {
        previewContainer.classList.remove("has-images");
        previewContainer.innerHTML = "";
        return;
    }
    previewContainer.classList.add("has-images");
    previewContainer.innerHTML = selectedImages.map((img, i) => `
        <div class="m-photo-thumb">
            <img src="${img.dataUrl}">
            <span class="m-photo-index">${i + 1}</span>
            <div class="m-photo-remove" data-remove-img="${i}">×</div>
        </div>
    `).join("");
    previewContainer.querySelectorAll("[data-remove-img]").forEach(btn => {
        btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-remove-img"), 10);
            selectedImages.splice(idx, 1);
            renderImagePreviews();
        });
    });
}

// 📸 1枚の画像ファイルを圧縮してdataURLに変換（Promiseでラップ）
function compressImageFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const max_size = 800; let width = img.width, height = img.height;
                if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, width, height);
                const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.6);
                resolve({
                    mimeType: "image/jpeg",
                    base64: compressedDataUrl.split(',')[1],
                    dataUrl: compressedDataUrl
                });
            };
            img.onerror = reject;
            img.src = evt.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

if (imageInput) {
    imageInput.addEventListener("change", async function(e) {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;
        for (const file of files) {
            try {
                selectedImages.push(await compressImageFile(file));
            } catch (err) {
                console.error("画像の読み込みに失敗しました:", err);
            }
        }
        renderImagePreviews();
        imageInput.value = "";
    });
}

if (submitBtn) {
    submitBtn.addEventListener("click", () => {
        const text = textInput.value.trim();
        if (!text && selectedImages.length === 0) { showToast("写真を選択するかメモを入力してください。", "error"); return; }
        analyzeAndAddProblem(text);
    });
}

function listenToCloudData(uid) {
    const userProblemsRef = ref(database, 'users/' + uid + '/problems');
    onValue(userProblemsRef, (snapshot) => {
        lastCloudProblemsSnapshot = snapshot.val() || {};
        rebuildFilterBarAndCards();
    }, (err) => {
        console.error(err);
        showToast("データの読み込みに失敗しました。ネットワークをご確認ください。", "error");
    });
}

function doLogin() { signInWithPopup(auth, provider).catch(e => console.error(e)); }
document.getElementById("main-login-btn").addEventListener("click", doLogin);

onAuthStateChanged(auth, (user) => {
    const authChip = document.getElementById("auth-chip");
    const loginNotice = document.getElementById("login-required-notice");
    const mainContent = document.getElementById("main-content");
    const registerBtn = document.getElementById("open-modal-btn");

    if (user) {
        currentUser = user;
        authChip.className = "m-auth-chip";
        authChip.innerHTML = `<img src="${user.photoURL}"><span>${user.displayName}</span>`;
        loginNotice.style.display = "none";
        mainContent.style.display = "block";
        if (registerBtn) registerBtn.style.display = "flex";
        listenToCloudData(user.uid);
        checkAndLoadLinkedLesson(user.uid);
    } else {
        currentUser = null;
        authChip.className = "m-auth-chip signed-out";
        authChip.textContent = "未サインイン";
        loginNotice.style.display = "block";
        mainContent.style.display = "none";
        if (registerBtn) registerBtn.style.display = "none";
    }
});
</script>
