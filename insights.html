<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOLZ">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <title>LOLZ // ナレッジ＆質問アーカイブ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile-nav.css">

    <!-- MathJax 3 (bbox / color 拡張パッケージを完全有効化) -->
    <script>
        window.MathJax = {
            loader: { load: ['[tex]/bbox', '[tex]/color'] },
            tex: {
                packages: { '[+]': ['bbox', 'color'] },
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                macros: {
                    fbox: ["\\bbox[2px,border:1px solid]{\\text{#1}}", 1],
                    boxed: ["\\bbox[2px,border:1px solid]{\\text{#1}}", 1]
                }
            },
            options: {
                ignoreHtmlClass: 'tex2jax_ignore',
                processHtmlClass: 'tex2jax_process',
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        .archive-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: calc(100vh - 4rem);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #22222a;
            padding-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: var(--fs-xl);
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 0.9;
            background: linear-gradient(90deg, var(--text-main) 70%, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 🎛 モード切り替え大タブ */
        .main-tab-bar { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .main-tab-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-bright-muted);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.6rem;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.1, 0.8, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .main-tab-btn:hover { background: rgba(0, 243, 255, 0.08); border-color: var(--accent-cyan); color: #fff; }
        .main-tab-btn.active {
            background: var(--accent-cyan) !important; color: #000 !important;
            font-weight: 900; border-color: var(--accent-cyan) !important;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
        }
        .main-tab-btn.tab-yellow.active {
            background: var(--accent-yellow) !important; border-color: var(--accent-yellow) !important;
            box-shadow: 0 0 20px rgba(255, 245, 0, 0.35);
        }

        /* ツールバー */
        .toolbar-card {
            padding: 1.2rem 1.6rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .filter-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .filter-label { font-size: 0.75rem; font-weight: 900; color: var(--text-muted); letter-spacing: 1px; min-width: 70px; }
        .search-input {
            flex-grow: 1; min-width: 200px; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12); color: #fff;
            padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.9rem;
        }
        .search-input:focus { outline: none; border-color: var(--accent-cyan); }
        .field-select {
            background: #000; color: var(--accent-cyan); border: 1px solid var(--accent-cyan);
            padding: 0.45rem 0.8rem; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; outline: none;
        }
        .toggle-btn {
            background: rgba(255, 255, 255, 0.04); color: var(--text-bright-muted);
            border: 1px solid var(--border-color); padding: 0.45rem 0.85rem; border-radius: 8px;
            font-size: 0.78rem; font-weight: 800; cursor: pointer; transition: all 0.15s ease;
            display: inline-flex; align-items: center; gap: 0.35rem;
        }
        .toggle-btn:hover { border-color: var(--accent-cyan); color: #fff; }
        .toggle-btn.active {
            background: rgba(0, 243, 255, 0.15); border-color: var(--accent-cyan); color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        /* 🎴 リッチ対比カード表示 */
        .insight-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
            gap: 1.4rem;
        }
        @media (max-width: 700px) {
            .insight-grid { grid-template-columns: 1fr; }
        }

        .insight-card {
            background: var(--card-bg-glass);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 18px;
            padding: 1.3rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1rem;
            transition: all 0.15s ease;
        }
        .insight-card.pinned {
            border-left-color: var(--accent-yellow);
            background: rgba(255, 245, 0, 0.03);
        }
        .insight-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.04);
        }
        .insight-card.pinned:hover { border-color: var(--accent-yellow); }

        /* 上半分：問題の型・問題文プレビュー */
        .insight-problem-preview {
            background: rgba(0, 243, 255, 0.03);
            border: 1px dashed rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .insight-problem-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
        }
        .insight-problem-snippet {
            font-size: 0.88rem;
            color: var(--text-bright-muted);
            line-height: 1.6;
            max-height: 130px;
            overflow-y: auto;
            word-break: break-word;
        }

        /* 下半分：極意・気づき */
        .insight-body-box {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .insight-body-label {
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .insight-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
            font-weight: 600;
        }

        /* 📋 爆速コンパクトリスト表示 */
        .insight-compact-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .insight-compact-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: var(--card-bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            transition: all 0.15s ease;
        }
        .insight-compact-row.pinned { border-left: 3px solid var(--accent-yellow); }
        .insight-compact-row:hover {
            border-color: var(--accent-cyan);
            transform: translateX(3px);
            background: rgba(255, 255, 255, 0.04);
        }
        .compact-main { flex-grow: 1; min-width: 0; }
        .compact-text {
            font-size: 0.95rem; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .compact-sub {
            font-size: 0.74rem; color: var(--text-muted); margin-top: 0.2rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 📁 単元グループ見出し（アコーディオン） */
        .group-header {
            font-size: 0.95rem; font-weight: 900; color: var(--accent-yellow);
            padding: 0.6rem 0.8rem; margin: 1.2rem 0 0.6rem 0;
            background: rgba(255, 245, 0, 0.06); border-left: 3px solid var(--accent-yellow);
            border-radius: 0 8px 8px 0; cursor: pointer; display: flex;
            align-items: center; justify-content: space-between; user-select: none;
        }
        .group-header:hover { background: rgba(255, 245, 0, 0.12); }
        .group-header.collapsed .group-chevron { transform: rotate(-90deg); }
        .group-chevron { transition: transform 0.15s ease; font-size: 0.75rem; }
        .group-content.collapsed { display: none; }

        /* ⭐ スターボタン */
        .star-btn {
            background: none; border: none; font-size: 1.1rem; cursor: pointer;
            color: #555; transition: transform 0.15s ease, color 0.15s ease; padding: 0.1rem;
        }
        .star-btn:hover { transform: scale(1.25); }
        .star-btn.active { color: var(--accent-yellow); text-shadow: 0 0 10px rgba(255, 245, 0, 0.6); }

        /* ✏️ インライン編集エリア */
        .inline-edit-textarea {
            width: 100%; min-height: 80px; background: #000; border: 1px solid var(--accent-cyan);
            color: #fff; padding: 0.6rem; border-radius: 8px; font-size: 0.95rem; font-family: inherit; resize: vertical;
        }

        /* 💬 質問ログ用スタイル */
        .qna-layout {
            display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; min-height: 600px;
        }
        @media (max-width: 1000px) { .qna-layout { grid-template-columns: 1fr; } }
        .qna-list-pane {
            max-height: calc(100vh - 280px); overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 0.4rem;
        }
        .qna-list-item {
            background: var(--card-bg-glass); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 0.9rem 1.1rem; cursor: pointer; transition: all 0.15s ease;
        }
        .qna-list-item:hover { border-color: var(--accent-yellow); transform: translateX(3px); }
        .qna-list-item.active {
            background: rgba(255, 245, 0, 0.08); border-color: var(--accent-yellow); box-shadow: 0 0 15px rgba(255, 245, 0, 0.15);
        }
        .qna-item-preview {
            font-size: 0.85rem; color: var(--text-bright-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.3rem;
        }
        .qna-detail-pane {
            background: var(--card-bg-glass); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 1.4rem; display: flex; flex-direction: column; gap: 0.8rem; min-height: 600px; max-height: calc(100vh - 280px);
        }
        .qna-detail-problem-card {
            background: rgba(0, 243, 255, 0.04); border: 1px dashed rgba(0, 243, 255, 0.25); border-radius: 12px;
            padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex-shrink: 0;
        }
        .qna-problem-header { font-size: 0.72rem; font-weight: 900; color: var(--accent-cyan); letter-spacing: 0.5px; }
        .qna-problem-body { font-size: 0.88rem; color: var(--text-bright-muted); line-height: 1.6; max-height: 120px; overflow-y: auto; word-break: break-word; }
        .qna-messages-stream { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-right: 0.4rem; }
        .chat-bubble { padding: 0.75rem 1.1rem; border-radius: 14px; font-size: 0.92rem; line-height: 1.65; max-width: 88%; word-break: break-word; box-sizing: border-box; }
        .bubble-user { background: rgba(255, 0, 127, 0.15); border-right: 3px solid var(--accent-magenta); color: #fff; align-self: flex-end; }
        .bubble-ai { background: rgba(18, 22, 34, 0.85); border-left: 3px solid var(--accent-cyan); color: #e0f2fe; align-self: flex-start; }

        /* 🎴 語呂合わせカード */
        .mnemonic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
        .mnemonic-card {
            background: var(--card-bg-glass); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-yellow);
            border-radius: 14px; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; transition: all 0.15s ease;
        }
        .mnemonic-card:hover { border-color: var(--accent-yellow); transform: translateY(-2px); }
        .mnemonic-body { font-size: 1.05rem; font-weight: 800; color: #ffffff; line-height: 1.6; }

        .goto-btn {
            font-size: 0.78rem; font-weight: 800; padding: 0.3rem 0.7rem; border-radius: 8px;
            background: rgba(0, 243, 255, 0.08); color: var(--accent-cyan); border: 1px solid var(--accent-cyan);
            text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem; transition: all 0.15s ease;
        }
        .goto-btn:hover { background: rgba(0, 243, 255, 0.2); }

        /* 📱 モバイル最適化：入れ子スクロールをやめ、ページ全体のスクロールに任せる */
        @media (max-width: 1000px) {
            .qna-list-pane { max-height: none; overflow-y: visible; }
            .qna-detail-pane { min-height: 0; max-height: none; }
            .main-tab-bar { gap: 0.5rem; }
            .main-tab-btn { padding: 0.65rem 1rem; font-size: 0.82rem; flex: 1 1 auto; justify-content: center; }
            .toolbar-card { padding: 1rem 1.1rem; }
            .filter-row { gap: 0.5rem; }
            .search-input { min-width: 0; width: 100%; }
        }

        /* 🔲 MathJax 穴埋め四角枠（\bbox）の美しいサイバーパンク風スタイル */
        mjx-box {
            border-color: rgba(0, 243, 255, 0.6) !important;
            background: rgba(0, 243, 255, 0.08) !important;
            border-radius: 4px !important;
            padding: 1px 5px !important;
            color: #ffffff !important;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="archive-container">
        <header class="m-mobile-header">
            <a href="index.html" class="m-back-btn" aria-label="誤答ノートに戻る">‹</a>
            <div class="m-mobile-header-title">💡 気づき・質問アーカイブ</div>
        </header>
        <div style="font-size: 0.78rem; color: var(--accent-cyan); font-weight: 800; margin: -0.6rem 0 1rem 0.1rem;" id="stat-summary-text">
            読み込み中...
        </div>

        <!-- メインタブ切り替え -->
        <div class="main-tab-bar">
            <button type="button" class="main-tab-btn active" id="tab-btn-insights">
                🧠 気づき・極意メモ (<span id="count-insights">0</span>)
            </button>
            <button type="button" class="main-tab-btn tab-yellow" id="tab-btn-qna">
                💬 AI質問ログ (<span id="count-qna">0</span>)
            </button>
            <button type="button" class="main-tab-btn tab-yellow" id="tab-btn-mnemonics">
                🎴 世界史 語呂合わせ (<span id="count-mnemonics">0</span>)
            </button>
        </div>

        <!-- ツールバー -->
        <div class="squircle-card glass-card toolbar-card">
            <div class="filter-row">
                <span class="filter-label">🔎 検索：</span>
                <input type="text" class="search-input" id="search-input" placeholder="キーワード・単元名・問題タイトルで検索...">
                
                <span class="filter-label" style="min-width:auto; margin-left:0.4rem;">📚 教科：</span>
                <select class="field-select" id="subject-select">
                    <option value="ALL">すべての教科</option>
                </select>

                <span class="filter-label" style="min-width:auto; margin-left:0.4rem;">🔀 並べ替え：</span>
                <select class="field-select" id="sort-select">
                    <option value="newest">更新が新しい順</option>
                    <option value="oldest">更新が古い順</option>
                    <option value="subject">教科・単元順</option>
                </select>
            </div>

            <!-- 気づきメモタブ専用のサブツールバー -->
            <div class="filter-row" id="insight-subtoolbar" style="border-top: 1px dashed rgba(255,255,255,0.08); padding-top:0.6rem;">
                <span class="filter-label">🎛 表示：</span>
                <button type="button" class="toggle-btn active" id="btn-view-card">🎴 対比カード</button>
                <button type="button" class="toggle-btn" id="btn-view-compact">📋 爆速リスト</button>
                <span style="color: #334455; margin: 0 0.3rem;">|</span>
                <button type="button" class="toggle-btn active" id="btn-toggle-group">📁 単元ごとにまとめる</button>
                <button type="button" class="toggle-btn" id="btn-toggle-pinned">⭐ スター付きのみ</button>
            </div>
        </div>

        <!-- メイン表示領域 -->
        <main>
            <!-- 1. 気づきメモビュー -->
            <div id="view-insights"></div>

            <!-- 2. AI質問ログビュー（2カラム） -->
            <div id="view-qna" class="qna-layout" style="display: none;">
                <div class="qna-list-pane" id="qna-list-pane"></div>
                <div class="qna-detail-pane" id="qna-detail-pane">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #22222a; padding-bottom:0.6rem; flex-wrap:wrap; gap:0.5rem;">
                        <div>
                            <span class="badge badge-physics" id="qna-detail-subject">--</span>
                            <span style="font-weight:800; font-size:0.95rem; margin-left:0.4rem;" id="qna-detail-title">質問を選択してください</span>
                            <div style="font-size:0.72rem; color:var(--text-muted); margin-top:0.2rem;" id="qna-detail-date"></div>
                        </div>
                        <div style="display:flex; gap:0.6rem;">
                            <a href="#" id="qna-detail-goto" class="goto-btn" style="display:none;">📌 問題を開く</a>
                            <button type="button" id="qna-detail-delete" class="tactile-btn" style="display:none; font-size:0.75rem; padding:0.35rem 0.75rem; background:rgba(255,0,127,0.1); color:var(--accent-magenta); border:1px solid var(--accent-magenta); box-shadow:none;">🗑 削除</button>
                        </div>
                    </div>

                    <div class="qna-detail-problem-card" id="qna-detail-problem-box" style="display: none;">
                        <div class="qna-problem-header">
                            <span>📖 対象の問題文</span>
                        </div>
                        <div class="qna-problem-body tex2jax_process" id="qna-detail-problem-text"></div>
                    </div>

                    <div class="qna-messages-stream" id="qna-messages-stream">
                        <div style="text-align:center; padding:5rem 1rem; color:var(--text-muted); font-size:0.9rem;">
                            左のリストから質問ログを選択すると、ここに会話全文が表示されます。
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 語呂合わせビュー -->
            <div id="view-mnemonics" class="mnemonic-grid" style="display: none;"></div>

            <!-- 空データ時の通知 -->
            <div id="empty-notice" style="display:none; text-align:center; padding:5rem 1rem; color:var(--text-muted); font-size:0.95rem;"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { showToast } from "./api-key-manager.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let currentUser = null;
        let activeTab = "insights"; // "insights" | "qna" | "mnemonics"
        let insightViewMode = "card"; // "card" | "compact"
        let isGrouped = true; // 単元グループ化 ON/OFF
        let filterPinnedOnly = false; // スター付きのみ ON/OFF
        let expandedGroups = new Set(); // 初期状態は空Set＝すべて折りたたんだ状態で開始

        let rawProblems = {};
        let rawQnaLogs = {};
        let rawLessons = {};
        let selectedQnaLogId = null;
        let editingProblemId = null; // その場編集中の問題ID
        let editingLessonMemoKey = null; // その場編集中の授業メモ（"lessonId:memoId"）

        // 🎛 タブ切り替え
        const tabBtnInsights = document.getElementById("tab-btn-insights");
        const tabBtnQna = document.getElementById("tab-btn-qna");
        const tabBtnMnemonics = document.getElementById("tab-btn-mnemonics");
        const insightSubToolbar = document.getElementById("insight-subtoolbar");

        function switchTab(tab) {
            activeTab = tab;
            tabBtnInsights.classList.toggle("active", tab === "insights");
            tabBtnQna.classList.toggle("active", tab === "qna");
            tabBtnMnemonics.classList.toggle("active", tab === "mnemonics");

            document.getElementById("view-insights").style.display = tab === "insights" ? "block" : "none";
            document.getElementById("view-qna").style.display = tab === "qna" ? "grid" : "none";

        // フィルター＆検索
        const searchInput = document.getElementById("search-input");

        function populateSubjectFilter() {
            const currentVal = subjectSelect.value || "ALL";
            let subjects = new Set();

            if (activeTab === "insights") {
                Object.values(rawProblems).forEach(p => { if (p.insight) subjects.add(p.subject || "未分類"); });
                buildLessonMemoItems().forEach(item => subjects.add(item.subject || "未分類"));
                buildMemorizationItems().forEach(item => subjects.add(item.subject || "未分類"));
            } else if (activeTab === "qna") {
                Object.values(rawQnaLogs).forEach(l => { if (l.subject) subjects.add(l.subject); });
            } else {
                subjects.add("世界史");
            }

            const sorted = [...subjects].sort((a, b) => a.localeCompare(b, "ja"));
            subjectSelect.innerHTML = `<option value="ALL">すべての教科</option>` +
                sorted.map(s => `<option value="${s}">${s}</option>`).join("");

            if (subjects.has(currentVal)) subjectSelect.value = currentVal;
        }

        function formatDate(iso) {
            if (!iso) return "";
            return new Date(iso).toLocaleDateString('ja-JP', { year: '2-digit', month: 'numeric', day: 'numeric' });
        }

        // 🎓 授業ノート（lesson.html）の気づきメモを気づき一覧アイテム形式に変換
        function detectSubjectFromLesson(lesson) {
            const text = ((lesson.title || "") + " " + (lesson.topicKey || "")).toLowerCase();
            if (/数学|微分|積分|ベクトル|数列|三角関数|確率/i.test(text)) return "数学";
            if (/化学|mol|酸化|還元|酸|塩基/i.test(text)) return "化学";
            if (/世界史|日本史|歴史/i.test(text)) return "世界史";
            if (/英語|文法/i.test(text)) return "英語";
            if (/物理|力学|電磁気|波動/i.test(text)) return "物理";
            return "未分類";
        }

        function buildLessonMemoItems() {
            const items = [];
            Object.entries(rawLessons).forEach(([lessonId, lesson]) => {
                if (!lesson || !Array.isArray(lesson.lessonMemos)) return;
                lesson.lessonMemos.forEach(m => {
                    if (!m || !m.text || !m.text.trim()) return;
                    items.push({
                        id: `lessonmemo_${lessonId}_${m.id}`,
                        lessonId,
                        memoId: m.id,
                        insight: m.text,
                        subject: detectSubjectFromLesson(lesson),
                        field: lesson.topicKey || lesson.title || "授業メモ",
                        short_title: lesson.title || "授業メモ",
                        insightUpdatedAt: m.updatedAt || m.createdAt,
                        createdAt: m.createdAt,
                        isPinned: !!m.pinned,
                        partIndex: m.partIndex,
                        partTitle: (lesson.parts && typeof m.partIndex === "number" && lesson.parts[m.partIndex]) ? lesson.parts[m.partIndex].title : "",
                        sourceType: "lesson"
                    });
                });
            });
            return items;
        }

        // 🧠 授業ページの「暗記事項リスト」を気づき一覧アイテム形式に変換
        //    （授業ページ内だけでなく、気づき・極意メモ一覧からも横断的に見えるようにする）
        function buildMemorizationItems() {
            const items = [];
            Object.entries(rawLessons).forEach(([lessonId, lesson]) => {
                if (!lesson || !Array.isArray(lesson.memorizationPoints)) return;
                lesson.memorizationPoints.forEach((mp, idx) => {
                    if (!mp || !mp.content || !mp.content.trim()) return;
                    const mpId = mp.id || `idx${idx}`;
                    items.push({
                        id: `memorize_${lessonId}_${mpId}`,
                        lessonId,
                        insight: mp.content + (mp.note ? `\n💡 ${mp.note}` : ""),
                        category: mp.category || "",
                        subject: detectSubjectFromLesson(lesson),
                        field: lesson.topicKey || lesson.title || "暗記事項",
                        short_title: lesson.title || "暗記事項",
                        insightUpdatedAt: lesson.updatedAt || lesson.createdAt,
                        createdAt: lesson.createdAt,
                        isPinned: false,
                        sourceType: "memorize"
                    });
                });
            });
            return items;
        }

        // 🧠 数式正規化＆穴埋め枠の修復処理
        function normalizeMathSyntax(str) {
            if (!str) return "";
            let s = String(str);

            // 1. \bbox[...] または \bbox[...]{...} の波括弧抜け・表記ゆれを完全正規化
            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*\{([^}]*)\}/g, (_, content) => {
                let c = content.trim();
                if (!c) c = "\\quad";
                else c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                return `\\bbox[2px,border:1px solid]{\\text{${content.trim()}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\]/g, `\\bbox[2px,border:1px solid]{\\text{\\quad}}`);

            // 2. \fbox, \boxed, \framebox の正規化
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s*\{([^}]*)\}/g, (_, content) => {
                let c = content.trim();
                if (!c) c = "\\quad";
                else c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s+([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                return `\\bbox[2px,border:1px solid]{\\text{${content.trim()}}}`;
            });

            // 3. $...$ の外にある \bbox や孤立した TeX 記号を $...$ で保護
            const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g);
            for (let i = 0; i < parts.length; i += 2) {
                let chunk = parts[i];
                if (!chunk) continue;

                // \bbox が $ の外にある場合、$ で包む
                chunk = chunk.replace(/(\\bbox\[2px,border:1px solid\]\{\\text\{[^}]*\}\}(?:\^[0-9A-Za-z^\circ]+)?)/g, '$$$1$$');

                // 孤立した TeX 記号・数式コマンドを $...$ で包む
                chunk = chunk.replace(/(\\(?:triangle|angle|sqrt|frac|vec|alpha|beta|gamma|theta|pi|pm|mp|le|ge|leqq|geqq|neq|approx|sim|equiv|subset|supset|cap|cup|times|div|cdot|int|sum|lim|log|ln|sin|cos|tan)\b[^\s$、。,.)）]*)/g, '$$$1$$');

                // 不正な連続 $$ や 空の $$ を整理
                chunk = chunk.replace(/\$\s*\$/g, '');

                parts[i] = chunk;
            }

            return parts.join("");
        }

        function formatQuestionText(raw) {
            if (!raw) return "";
            let t = normalizeMathSyntax(raw);
            t = t.replace(/\\n/g, '\n').replace(/\r\n?/g, '\n').trim();
            const noWordBefore = "(?<![0-9A-Za-zぁ-んァ-ヶー一-龠々'’])";
            t = t.replace(new RegExp(noWordBefore + "\\(\\s*([1-9]|10)\\s*\\)(?!\\d)", "g"), "\n\n($1)");
            t = t.replace(new RegExp(noWordBefore + "\\(\\s*(i{1,3}|iv)\\s*\\)", "gi"), "\n($1)");
            return t.replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "").trim().replace(/\n/g, "<br>");
        }

        // Markdown＆数式フォーマット関数
        function renderFormattedMarkdown(text) {
            if (!text) return "";
            let trimmed = normalizeMathSyntax(text).trim();
            const mathBlocks = [];
            let placeholderText = trimmed.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%%MATH_${mathBlocks.length - 1}%%%`;
            });
            let formatted = placeholderText
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            formatted = formatted.replace(/^###\s*(.+)$/gm, '<h4 style="font-size:0.92rem; font-weight:800; color:var(--accent-cyan); margin:0.5rem 0 0.2rem 0; border-bottom:1px solid rgba(0,243,255,0.2); padding-bottom:0.2rem;">$1</h4>');
            formatted = formatted.replace(/^---\s*$/gm, '<hr style="border:none; border-top:1px dashed rgba(255,255,255,0.15); margin:0.5rem 0;">');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="color:#ffffff; font-weight:700;">$1</strong>');
            formatted = formatted.replace(/^(\d+\.)\s*/gm, '<span style="color:var(--accent-yellow); font-weight:800; margin-right:0.3rem;">$1</span>');
            formatted = formatted.replace(/%%%MATH_(\d+)%%%/g, (_, idx) => mathBlocks[idx]);
            return formatted.replace(/\n/g, '<br>');
        }

        // 🧠 1. 気づきメモ描画
        function renderInsights() {
            const container = document.getElementById("view-insights");
            const query = searchInput.value.trim().toLowerCase();
            const subject = subjectSelect.value;
            const sort = sortSelect.value;

            let items = [
                ...Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").map(p => ({ ...p, sourceType: "problem" })),
                ...buildLessonMemoItems(),
                ...buildMemorizationItems()
            ];

            if (subject !== "ALL") items = items.filter(p => (p.subject || "未分類") === subject);
            if (filterPinnedOnly) items = items.filter(p => !!p.isPinned);
            if (query) {
                items = items.filter(p =>
                    (p.insight || "").toLowerCase().includes(query) ||
                    (p.short_title || "").toLowerCase().includes(query) ||
                    (p.field || "").toLowerCase().includes(query) ||
                    (p.title || "").toLowerCase().includes(query)
                );
            }

            // ソート（スター付きは常に最優先）
            items.sort((a, b) => {
                if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
                if (sort === "oldest") return new Date(a.insightUpdatedAt || a.createdAt || 0) - new Date(b.insightUpdatedAt || b.createdAt || 0);
                if (sort === "subject") {
                    const subA = (a.subject || "") + (a.field || "");
                    const subB = (b.subject || "") + (b.field || "");
                    return subA.localeCompare(subB, "ja");
                }
                return new Date(b.insightUpdatedAt || b.createdAt || 0) - new Date(a.insightUpdatedAt || a.createdAt || 0);
            });

            if (items.length === 0) {
                container.innerHTML = "";
                showEmptyNotice("該当する「気づき・極意メモ」が見つかりませんでした。");
                return;
            }
            hideEmptyNotice();

            // 単元グループ化の処理
            if (isGrouped) {
                const groups = {};
                items.forEach(p => {
                    const key = `${p.subject || "未分類"} ＞ ${p.field || "全般"}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(p);
                });

                container.innerHTML = Object.entries(groups).map(([groupKey, groupItems]) => {
                    const isExpanded = expandedGroups.has(groupKey);
                    const rowsHtml = insightViewMode === "card"
                        ? `<div class="insight-grid">${groupItems.map(p => renderCardHtml(p)).join("")}</div>`
                        : `<div class="insight-compact-list">${groupItems.map(p => renderCompactRowHtml(p)).join("")}</div>`;

                    return `
                        <div class="group-section">
                            <div class="group-header ${isExpanded ? '' : 'collapsed'}" data-group="${groupKey}">
                                <span>📁 ${groupKey} (${groupItems.length}件)</span>
                                <span class="group-chevron">▼</span>
                            </div>
                            <div class="group-content ${isExpanded ? '' : 'collapsed'}" data-content="${groupKey}">
                                ${rowsHtml}
                            </div>
                        </div>
                    `;
                }).join("");

                // アコーディオン開閉
                container.querySelectorAll(".group-header").forEach(header => {
                    header.addEventListener("click", () => {
                        const key = header.getAttribute("data-group");
                        if (expandedGroups.has(key)) expandedGroups.delete(key);
                        else expandedGroups.add(key);
                        renderInsights();
                    });
                });

            } else {
                // フラット表示
                container.innerHTML = insightViewMode === "card"
                    ? `<div class="insight-grid">${items.map(p => renderCardHtml(p)).join("")}</div>`
                    : `<div class="insight-compact-list">${items.map(p => renderCompactRowHtml(p)).join("")}</div>`;
            }

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([container]).catch(err => console.log('MathJax typeset error:', err));
            }
        }

        // リッチ対比カードのHTML
        function renderCardHtml(p) {
            if (p.sourceType === "lesson") return renderLessonMemoCardHtml(p);
            if (p.sourceType === "memorize") return renderMemorizeCardHtml(p);

            const isEditing = editingProblemId === p.id;
            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";

            const bodyContent = isEditing
                ? `
                    <div style="display:flex; flex-direction:column; gap:0.4rem;">
                        <textarea class="inline-edit-textarea" id="inline-textarea-${p.id}">${p.insight || ""}</textarea>
                        <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                            <button type="button" class="tactile-btn tactile-btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.6rem;" onclick="cancelEditInsight(event)">キャンセル</button>
                            <button type="button" class="tactile-btn" style="font-size:0.75rem; padding:0.25rem 0.6rem; background:var(--accent-cyan); color:#000;" onclick="saveInlineInsight('${p.id}', event)">💾 保存</button>
                        </div>
                    </div>
                `
                : `<div class="insight-text tex2jax_process" onclick="startEditInsight('${p.id}', event)" title="クリックしてその場で編集">${normalizeMathSyntax(p.insight)}</div>`;

            return `
                <div class="insight-card ${pinnedClass}">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; margin-bottom:0.6rem;">
                            <span class="badge badge-physics">${p.subject || "未分類"} // ${p.field || "未分類"}</span>
                            <div style="display:flex; align-items:center; gap:0.5rem;">
                                <span style="font-size:0.72rem; color:var(--text-muted);">🗓️ ${formatDate(p.insightUpdatedAt || p.createdAt)}</span>
                                <button type="button" class="star-btn ${starClass}" onclick="togglePin('${p.id}', event)" title="スター（最上部に固定）">★</button>
                            </div>
                        </div>

                        <!-- 上半分：問題の型プレビュー -->
                        <div class="insight-problem-preview">
                            <div class="insight-problem-title">📌 ${p.short_title || "問題"}</div>
                            <div class="insight-problem-snippet tex2jax_process">${formatQuestionText(p.title || "（問題文なし）")}</div>
                        </div>
                    </div>

                    <!-- 下半分：掴んだ極意 -->
                    <div class="insight-body-box">
                        <div class="insight-body-label">
                            <span>🧠 掴んだ極意・解法の地図</span>
                            ${!isEditing ? `<button type="button" style="background:none; border:none; color:var(--accent-cyan); font-size:0.72rem; font-weight:800; cursor:pointer;" onclick="startEditInsight('${p.id}', event)">✏️ 編集</button>` : ''}
                        </div>
                        ${bodyContent}
                    </div>

                    <div style="display:flex; justify-content:flex-end; border-top:1px dashed rgba(255,255,255,0.08); padding-top:0.6rem;">
                        <a href="problem.html?id=${encodeURIComponent(p.id)}" class="goto-btn">問題ページを開く ➔</a>
                    </div>
                </div>
            `;
        }

        // 授業メモ（lesson.html）カードのHTML
        function renderLessonMemoCardHtml(p) {
            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";
            const partLabel = p.partTitle ? `第${p.partIndex + 1}回: ${p.partTitle}` : "";
            const memoKey = `${p.lessonId}:${p.memoId}`;
            const isEditing = editingLessonMemoKey === memoKey;

            const bodyHtml = isEditing
                ? `<textarea class="inline-edit-textarea" id="lessonmemo-edit-${p.lessonId}_${p.memoId}">${p.insight || ""}</textarea>
                   <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:0.5rem;">
                       <button type="button" class="tactile-btn tactile-btn-secondary" style="font-size:0.72rem; padding:0.4rem 0.8rem;" onclick="cancelEditLessonMemoFromInsights(event)">キャンセル</button>
                       <button type="button" class="tactile-btn" style="font-size:0.72rem; padding:0.4rem 0.8rem;" onclick="saveEditLessonMemoFromInsights('${p.lessonId}', '${p.memoId}', event)">💾 保存</button>
                   </div>`
                : `<div class="insight-text tex2jax_process" onclick="startEditLessonMemoFromInsights('${p.lessonId}', '${p.memoId}', event)" title="クリックしてその場で編集">${normalizeMathSyntax(p.insight)}</div>`;

            return `
                <div class="insight-card ${pinnedClass}" style="border-left-color: var(--accent-yellow);">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; margin-bottom:0.6rem;">
                            <span class="badge badge-physics" style="background: rgba(255,245,0,0.1); border-color: var(--accent-yellow); color: var(--accent-yellow);">📖 授業メモ // ${p.subject || "未分類"}</span>
                            <div style="display:flex; align-items:center; gap:0.5rem;">
                                <span style="font-size:0.72rem; color:var(--text-muted);">🗓️ ${formatDate(p.insightUpdatedAt || p.createdAt)}</span>
                                <button type="button" class="star-btn ${starClass}" onclick="toggleLessonMemoPin('${p.lessonId}', '${p.memoId}', event)" title="スター（最上部に固定）">★</button>
                            </div>
                        </div>

                        <div class="insight-problem-preview" style="border-color: rgba(255,245,0,0.25); background: rgba(255,245,0,0.03);">
                            <div class="insight-problem-title">📘 ${p.short_title}</div>
                            ${partLabel ? `<div style="font-size:0.78rem; color:var(--text-muted);">${partLabel}</div>` : ""}
                        </div>
                    </div>

                    <div class="insight-body-box">
                        <div class="insight-body-label">
                            <span>✏️ 授業中のメモ</span>
                            <div style="display:flex; gap:0.7rem;">
                                ${!isEditing ? `<button type="button" style="background:none; border:none; color:var(--accent-cyan); font-size:0.72rem; font-weight:800; cursor:pointer;" onclick="startEditLessonMemoFromInsights('${p.lessonId}', '${p.memoId}', event)">✏️ 編集</button>` : ''}
                                <button type="button" style="background:none; border:none; color:var(--accent-magenta); font-size:0.72rem; font-weight:800; cursor:pointer;" onclick="deleteLessonMemoFromInsights('${p.lessonId}', '${p.memoId}', event)">🗑 削除</button>
                            </div>
                        </div>
                        ${bodyHtml}
                    </div>

                    <div style="display:flex; justify-content:flex-end; border-top:1px dashed rgba(255,255,255,0.08); padding-top:0.6rem;">
                        <a href="lesson.html?id=${encodeURIComponent(p.lessonId)}" class="goto-btn">授業を開く ➔</a>
                    </div>
                </div>
            `;
        }

        // 🧠 暗記事項（lesson.htmlで自動生成）カードのHTML（読み取り専用・授業を横断して一覧表示）
        function renderMemorizeCardHtml(p) {
            return `
                <div class="insight-card" style="border-left-color: var(--accent-cyan);">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; margin-bottom:0.6rem;">
                            <span class="badge badge-physics" style="background: rgba(0,243,255,0.1); border-color: var(--accent-cyan); color: var(--accent-cyan);">🧠 暗記事項 // ${p.subject || "未分類"}</span>
                            <span style="font-size:0.72rem; color:var(--text-muted);">🗓️ ${formatDate(p.insightUpdatedAt || p.createdAt)}</span>
                        </div>

                        <div class="insight-problem-preview" style="border-color: rgba(0,243,255,0.25); background: rgba(0,243,255,0.03);">
                            <div class="insight-problem-title">📘 ${p.short_title}</div>
                            ${p.category ? `<div style="font-size:0.78rem; color:var(--text-muted);">${p.category}</div>` : ""}
                        </div>
                    </div>

                    <div class="insight-body-box">
                        <div class="insight-body-label"><span>🧠 覚えるべきこと</span></div>
                        <div class="insight-text tex2jax_process">${normalizeMathSyntax(p.insight)}</div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; border-top:1px dashed rgba(255,255,255,0.08); padding-top:0.6rem;">
                        <a href="lesson.html?id=${encodeURIComponent(p.lessonId)}" class="goto-btn">授業を開く ➔</a>
                    </div>
                </div>
            `;
        }

        // 爆速リストのHTML
        function renderCompactRowHtml(p) {
            if (p.sourceType === "lesson") return renderLessonMemoCompactRowHtml(p);
            if (p.sourceType === "memorize") return renderMemorizeCompactRowHtml(p);

            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";

            return `
                <div class="insight-compact-row ${pinnedClass}">
                    <button type="button" class="star-btn ${starClass}" onclick="togglePin('${p.id}', event)" title="スター">★</button>
                    <span class="badge badge-physics" style="font-size:0.68rem; flex-shrink:0;">${p.subject || "未分類"} // ${p.field || "未分類"}</span>
                    <div class="compact-main">
                        <div class="compact-text tex2jax_process">${normalizeMathSyntax(p.insight)}</div>
                        <div class="compact-sub">📌 ${p.short_title || "問題"} ｜ ${formatDate(p.insightUpdatedAt || p.createdAt)}</div>
                    </div>
                    <a href="problem.html?id=${encodeURIComponent(p.id)}" class="goto-btn" style="flex-shrink:0;">➔</a>
                </div>
            `;
        }

        function renderLessonMemoCompactRowHtml(p) {
            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";

            return `
                <div class="insight-compact-row ${pinnedClass}">
                    <button type="button" class="star-btn ${starClass}" onclick="toggleLessonMemoPin('${p.lessonId}', '${p.memoId}', event)" title="スター">★</button>
                    <span class="badge badge-physics" style="font-size:0.68rem; flex-shrink:0; background: rgba(255,245,0,0.1); border-color: var(--accent-yellow); color: var(--accent-yellow);">📖 ${p.subject || "未分類"}</span>
                    <div class="compact-main">
                        <div class="compact-text tex2jax_process">${normalizeMathSyntax(p.insight)}</div>
                        <div class="compact-sub">📘 ${p.short_title} ｜ ${formatDate(p.insightUpdatedAt || p.createdAt)}</div>
                    </div>
                    <button type="button" onclick="deleteLessonMemoFromInsights('${p.lessonId}', '${p.memoId}', event)" style="flex-shrink:0; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem;" title="削除">🗑</button>
                    <a href="lesson.html?id=${encodeURIComponent(p.lessonId)}" class="goto-btn" style="flex-shrink:0;">➔</a>
                </div>
            `;
        }

        function renderMemorizeCompactRowHtml(p) {
            return `
                <div class="insight-compact-row">
                    <span class="badge badge-physics" style="font-size:0.68rem; flex-shrink:0; background: rgba(0,243,255,0.1); border-color: var(--accent-cyan); color: var(--accent-cyan);">🧠 ${p.subject || "未分類"}</span>
                    <div class="compact-main">
                        <div class="compact-text tex2jax_process">${normalizeMathSyntax(p.insight)}</div>
                        <div class="compact-sub">📘 ${p.short_title} ｜ ${formatDate(p.insightUpdatedAt || p.createdAt)}</div>
                    </div>
                    <a href="lesson.html?id=${encodeURIComponent(p.lessonId)}" class="goto-btn" style="flex-shrink:0;">➔</a>
                </div>
            `;
        }

        // 💬 2. AI質問ログ描画
        function renderQna() {
            const listPane = document.getElementById("qna-list-pane");
            const query = searchInput.value.trim().toLowerCase();
            const subject = subjectSelect.value;
            const sort = sortSelect.value;

            let entries = Object.entries(rawQnaLogs);
            if (subject !== "ALL") entries = entries.filter(([, l]) => (l.subject || "未分類") === subject);
            if (query) {
                entries = entries.filter(([, l]) =>
                    (l.shortTitle || "").toLowerCase().includes(query) ||
                    (l.field || "").toLowerCase().includes(query) ||
                    (l.messages || []).some(m => (m.content || "").toLowerCase().includes(query))
                );
            }

            entries.sort((a, b) => {
                if (sort === "oldest") return new Date(a[1].savedAt || 0) - new Date(b[1].savedAt || 0);
                if (sort === "subject") return (a[1].subject || "").localeCompare(b[1].subject || "", "ja");
                return new Date(b[1].savedAt || 0) - new Date(a[1].savedAt || 0);
            });

            if (entries.length === 0) {
                listPane.innerHTML = "";
                showEmptyNotice("該当する「AI質問ログ」が見つかりませんでした。");
                return;
            }
            hideEmptyNotice();

            listPane.innerHTML = entries.map(([id, log]) => {
                const firstUser = (log.messages || []).find(m => m.role === "user");
                const preview = firstUser ? firstUser.content : "（内容なし）";
                const activeCls = id === selectedQnaLogId ? "active" : "";
                return `
                    <div class="qna-list-item ${activeCls}" data-qna-id="${id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem;">
                            <span class="badge badge-physics" style="font-size:0.68rem;">${log.subject || "未分類"} // ${log.field || "未分類"}</span>
                            <span style="font-size:0.68rem; color:var(--text-muted);">${formatDate(log.savedAt)}</span>
                        </div>
                        <div style="font-weight:800; font-size:0.88rem; color:var(--accent-yellow); margin-top:0.3rem;">📌 ${log.shortTitle || "問題"}</div>
                        <div class="qna-item-preview">💬 ${preview}</div>
                    </div>
                `;
            }).join("");

            listPane.querySelectorAll("[data-qna-id]").forEach(el => {
                el.addEventListener("click", () => {
                    selectedQnaLogId = el.getAttribute("data-qna-id");
                    renderQna();
                    renderQnaDetail(selectedQnaLogId);
                    if (window.innerWidth <= 1000) {
                        const detailPane = document.getElementById("qna-detail-pane");
                        if (detailPane) detailPane.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                });
            });

            if (selectedQnaLogId && rawQnaLogs[selectedQnaLogId]) {
                renderQnaDetail(selectedQnaLogId);
            }
        }

        function renderQnaDetail(logId) {
            const log = rawQnaLogs[logId];
            if (!log) return;

            document.getElementById("qna-detail-subject").textContent = `${log.subject || "未分類"} // ${log.field || "未分類"}`;
            document.getElementById("qna-detail-title").textContent = log.shortTitle || "無題の問題";
            document.getElementById("qna-detail-date").textContent = `🗓️ 記録日時: ${formatDate(log.savedAt)}`;

            const gotoBtn = document.getElementById("qna-detail-goto");
            gotoBtn.style.display = "inline-flex";
            gotoBtn.href = `problem.html?id=${encodeURIComponent(log.problemId)}`;

            const delBtn = document.getElementById("qna-detail-delete");
            delBtn.style.display = "inline-flex";
            delBtn.onclick = async () => {
                if (!confirm("この質問ログを削除しますか？")) return;
                try {
                    await remove(ref(database, 'users/' + currentUser.uid + '/qna_logs/' + logId));
                    selectedQnaLogId = null;
                    showToast("質問ログを削除しました。", "success", 2500);
                } catch (e) {
                    showToast("削除に失敗しました。", "error");
                }
            };

            const problemBox = document.getElementById("qna-detail-problem-box");
            const problemTextEl = document.getElementById("qna-detail-problem-text");
            const sourceProb = rawProblems[log.problemId];
            if (sourceProb && sourceProb.title) {
                problemTextEl.innerHTML = formatQuestionText(sourceProb.title);
                problemBox.style.display = "flex";
            } else {
                problemBox.style.display = "none";
            }

            const stream = document.getElementById("qna-messages-stream");
            stream.innerHTML = (log.messages || []).map(m => {
                const isUser = m.role === "user";
                const contentHtml = isUser
                    ? (m.content || "").trim().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>')
                    : renderFormattedMarkdown(m.content || "");

                return `
                    <div class="chat-bubble ${isUser ? 'bubble-user' : 'bubble-ai'} tex2jax_process">
                        <div style="font-size:0.68rem; font-weight:800; margin-bottom:0.25rem; opacity:0.75;">${isUser ? '👤 あなた' : '🤖 AIチューター'}</div>
                        <div>${contentHtml}</div>
                    </div>
                `;
            }).join("");

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([problemBox, stream]).catch(err => console.log('MathJax typeset error:', err));
            }
        }

        // 🎴 3. 語呂合わせ描画
        function renderMnemonics() {
            const container = document.getElementById("view-mnemonics");
            const query = searchInput.value.trim().toLowerCase();

            let items = Object.values(rawProblems).filter(p => p && p.subject === "世界史" && p.mnemonic && p.mnemonic.trim() !== "");

            if (query) {
                items = items.filter(p =>
                    (p.mnemonic || "").toLowerCase().includes(query) ||
                    (p.short_title || "").toLowerCase().includes(query) ||
                    (p.field || "").toLowerCase().includes(query)
                );
            }

            if (items.length === 0) {
                container.innerHTML = "";
                showEmptyNotice("登録済みの「世界史 語呂合わせ」が見つかりませんでした。");
                return;
            }
            hideEmptyNotice();

            container.innerHTML = items.map(p => `
                <div class="mnemonic-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; flex-wrap:wrap;">
                        <span class="badge badge-history">${p.field || "世界史"}</span>
                        <span style="font-size:0.82rem; font-weight:800; color:var(--accent-yellow);">📌 ${p.short_title || "問題"}</span>
                    </div>
                    <div class="mnemonic-body">🎴 ${p.mnemonic}</div>
                    <div style="display:flex; justify-content:flex-end; margin-top:0.4rem; padding-top:0.4rem; border-top:1px dashed rgba(255,255,255,0.08);">
                        <a href="problem.html?id=${encodeURIComponent(p.id)}" class="goto-btn">問題を開く ➔</a>
                    </div>
                </div>
            `).join("");
        }

        function renderActiveView() {
            if (activeTab === "insights") renderInsights();
            else if (activeTab === "qna") renderQna();
            else if (activeTab === "mnemonics") renderMnemonics();
        }

        function showEmptyNotice(msg) {
            const el = document.getElementById("empty-notice");
            el.textContent = msg;
            el.style.display = "block";
        }
        function hideEmptyNotice() {
            document.getElementById("empty-notice").style.display = "none";
        }

        function updateCounts() {
            const insightCount = Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").length
                + buildLessonMemoItems().length;
            const qnaCount = Object.keys(rawQnaLogs).length;
            const mnemonicCount = Object.values(rawProblems).filter(p => p && p.subject === "世界史" && p.mnemonic && p.mnemonic.trim() !== "").length;

            document.getElementById("count-insights").textContent = insightCount;
            document.getElementById("count-qna").textContent = qnaCount;
            document.getElementById("count-mnemonics").textContent = mnemonicCount;
            document.getElementById("stat-summary-text").textContent = `総蓄積ナレッジ: ${insightCount + qnaCount + mnemonicCount} 件`;
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                location.href = "index.html";
                return;
            }
            currentUser = user;

            onValue(ref(database, 'users/' + user.uid + '/problems'), (snapshot) => {
                rawProblems = snapshot.val() || {};
                updateCounts();
                populateSubjectFilter();
                renderActiveView();
            });

            onValue(ref(database, 'users/' + user.uid + '/qna_logs'), (snapshot) => {
                rawQnaLogs = snapshot.val() || {};
                updateCounts();
                populateSubjectFilter();
                renderActiveView();
            });

            onValue(ref(database, 'users/' + user.uid + '/lessons'), (snapshot) => {
                rawLessons = snapshot.val() || {};
                updateCounts();
                populateSubjectFilter();
                renderActiveView();
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW register error:', err));
            });
        }
    </script>

        <a href="refbook.html" class="m-tab"><span class="m-tab-icon">📚</span>参考書</a>
        <a href="insights.html" class="m-tab active"><span class="m-tab-icon">💡</span>気づき</a>

</body>
